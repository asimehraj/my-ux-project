<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoHazard — Slope Stability</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: var(--font-family-base);
      font-size: var(--font-size-body-md);
      line-height: var(--line-height-body-md);
      background: var(--color-surface-default);
      color: var(--color-text-primary);
      -webkit-font-smoothing: antialiased;
    }

    .app {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* Map */
    .map {
      position: absolute;
      inset: 0;
      background: var(--color-surface-default);
      z-index: 0;
    }

    .map__grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(color-mix(in srgb, var(--color-teal-500) 8%, transparent) 1px, transparent 1px),
        linear-gradient(90deg, color-mix(in srgb, var(--color-teal-500) 8%, transparent) 1px, transparent 1px);
      background-size: var(--space-12) var(--space-12);
      pointer-events: none;
    }

    .map__label {
      position: absolute;
      top: 50%;
      left: 55%;
      transform: translate(-50%, -50%);
      font-size: var(--font-size-label);
      font-weight: var(--font-weight-medium);
      line-height: var(--line-height-body-sm);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: color-mix(in srgb, var(--color-teal-500) 25%, transparent);
      pointer-events: none;
      user-select: none;
    }

    /* Top navigation */
    .topnav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      width: 100%;
      height: calc(var(--space-16) + var(--space-1));
      display: flex;
      align-items: center;
      padding: 0 var(--space-5);
      background: var(--color-surface-default);
      border-bottom: 1px solid var(--color-border-default);
      z-index: 50;
    }

    .topnav__left {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      flex-shrink: 0;
    }

    .topnav__logo {
      width: calc(var(--space-8) + var(--space-1));
      height: calc(var(--space-8) + var(--space-1));
      border-radius: var(--radius-xs);
      background: var(--color-surface-raised);
      border: 1px solid var(--color-border-default);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .topnav__logo svg {
      width: var(--space-5);
      height: var(--space-5);
      fill: var(--color-icon-brand);
    }

    .topnav__brand {
      font-size: var(--font-size-body-md);
      font-weight: var(--font-weight-semibold);
      line-height: var(--line-height-body-md);
      letter-spacing: -0.01em;
    }

    .topnav__breadcrumb {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-left: var(--space-5);
      padding-left: var(--space-5);
      border-left: 1px solid var(--color-border-default);
      font-size: var(--font-size-body-sm);
      line-height: var(--line-height-body-sm);
      color: var(--color-text-secondary);
    }

    .topnav__breadcrumb svg {
      width: var(--space-3);
      height: var(--space-3);
      stroke: var(--color-icon-subtle);
      fill: none;
      stroke-width: 2;
    }

    .topnav__breadcrumb strong {
      color: var(--color-text-primary);
      font-weight: var(--font-weight-medium);
    }

    .topnav__search-wrap {
      flex: 1;
      display: flex;
      justify-content: flex-end;
      padding: 0 var(--space-6);
      max-width: calc(var(--space-12) * 10);
      margin-left: auto;
    }

    .topnav__search {
      position: relative;
      width: 100%;
      max-width: calc(var(--space-10) * 8);
    }

    .topnav__search svg {
      position: absolute;
      left: var(--space-3);
      top: 50%;
      transform: translateY(-50%);
      width: var(--space-4);
      height: var(--space-4);
      stroke: var(--color-icon-subtle);
      fill: none;
      stroke-width: 2;
      pointer-events: none;
    }

    .topnav__search input {
      width: 100%;
      height: calc(var(--space-8) + var(--space-1));
      padding: 0 var(--space-3) 0 calc(var(--space-8) + var(--space-2));
      font-family: inherit;
      font-size: var(--font-size-body-sm);
      line-height: var(--line-height-body-sm);
      color: var(--color-text-primary);
      background: var(--color-surface-raised);
      border: 1px solid var(--color-border-default);
      border-radius: var(--radius-xs);
      outline: none;
      transition: border-color 0.15s;
    }

    .topnav__search input::placeholder {
      color: var(--color-text-tertiary);
    }

    .topnav__search input:focus {
      border-color: var(--color-border-brand);
    }

    .topnav__right {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      flex-shrink: 0;
    }

    .icon-btn {
      width: calc(var(--space-8) + var(--space-1));
      height: calc(var(--space-8) + var(--space-1));
      border: 1px solid var(--color-border-default);
      border-radius: var(--radius-xs);
      background: var(--color-surface-raised);
      color: var(--color-icon-subtle);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }

    .icon-btn:hover {
      color: var(--color-icon-default);
      border-color: var(--color-border-strong);
      background: var(--color-surface-subtle);
    }

    .icon-btn svg {
      width: var(--space-4);
      height: var(--space-4);
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .topnav__avatar {
      width: calc(var(--space-8) + var(--space-1));
      height: calc(var(--space-8) + var(--space-1));
      border-radius: var(--radius-full);
      background: linear-gradient(135deg, var(--color-teal-500), var(--color-teal-600));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--font-size-body-sm);
      font-weight: var(--font-weight-semibold);
      line-height: var(--line-height-body-sm);
      color: var(--color-text-inverse);
      border: 1px solid color-mix(in srgb, var(--color-border-brand) 50%, transparent);
      cursor: pointer;
    }

    /* Right toolbar */
    .toolbar {
      position: fixed;
      top: calc((100vh + var(--space-16) + var(--space-1)) / 2);
      right: var(--space-4);
      transform: translateY(-50%);
      width: calc(var(--space-10) + var(--space-1));
      max-height: calc(100vh - var(--space-16) - var(--space-1) - var(--space-8));
      height: auto;
      background: var(--color-surface-default);
      border: 1px solid var(--color-border-default);
      border-radius: var(--radius-m);
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      padding: var(--space-1);
      overflow-x: visible;
      overflow-y: auto;
      z-index: 40;
    }

    .toolbar__btn {
      width: 100%;
      height: calc(var(--space-8) + var(--space-2));
      border: none;
      border-bottom: 1px solid var(--color-border-default);
      border-radius: 0;
      background: transparent;
      color: var(--color-icon-subtle);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: background 0.15s, color 0.15s;
    }

    .toolbar__btn:last-child {
      border-bottom: none;
    }

    .toolbar__btn:hover {
      background: var(--color-surface-raised);
      color: var(--color-icon-default);
    }

    .toolbar__btn svg {
      width: var(--space-4);
      height: var(--space-4);
      stroke: currentColor;
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .toolbar__btn[title]:hover::after {
      content: attr(title);
      position: absolute;
      right: calc(100% + var(--space-2));
      top: 50%;
      transform: translateY(-50%);
      white-space: nowrap;
      padding: var(--space-2) var(--space-2);
      font-size: var(--font-size-badge);
      font-weight: var(--font-weight-medium);
      line-height: var(--line-height-body-sm);
      color: var(--color-text-primary);
      background: var(--color-surface-default);
      border: 1px solid var(--color-border-default);
      box-shadow: var(--shadow-md);
      border-radius: var(--radius-xs);
      pointer-events: none;
      z-index: 50;
    }

    .toolbar__divider {
      display: none;
    }

    /* Map controls */
    .map-controls {
      position: absolute;
      bottom: var(--space-6);
      right: calc(var(--space-10) + var(--space-5));
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
      z-index: 20;
    }

    .map-controls__btn {
      width: var(--space-8);
      height: var(--space-8);
      border: 1px solid var(--color-border-default);
      background: var(--color-surface-default);
      color: var(--color-text-primary);
      box-shadow: var(--shadow-sm);
      font-size: var(--font-size-body-lg);
      font-weight: var(--font-weight-regular);
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .map-controls__btn:first-child {
      border-radius: var(--radius-xs) var(--radius-xs) 0 0;
    }

    .map-controls__btn:last-child {
      border-radius: 0 0 var(--radius-xs) var(--radius-xs);
    }

    .map-controls__btn:hover {
      background: var(--color-surface-raised);
    }

    .scale-bar__line,
    .scale-bar__line::before,
    .scale-bar__line::after {
      background: var(--color-text-primary);
    }

    .scale-bar {
      position: absolute;
      bottom: var(--space-6);
      left: calc(var(--space-12) * 7 + var(--space-6) + var(--space-6));
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
      align-items: flex-start;
    }

    .scale-bar__line {
      width: calc(var(--space-10) * 2);
      height: var(--space-1);
      position: relative;
    }

    .scale-bar__line::before,
    .scale-bar__line::after {
      content: "";
      position: absolute;
      bottom: 0;
      width: var(--space-1);
      height: var(--space-2);
    }

    .scale-bar__line::before { left: 0; }
    .scale-bar__line::after { right: 0; }

    .scale-bar__label {
      font-size: var(--font-size-badge);
      font-weight: var(--font-weight-medium);
      line-height: var(--line-height-body-sm);
      color: var(--color-text-secondary);
      letter-spacing: 0.02em;
    }

    /* Left panel */
    .panel {
      position: absolute;
      top: calc(var(--space-16) + var(--space-6) + var(--space-4) + var(--space-1));
      left: var(--space-4);
      width: calc(var(--space-12) * 7 + var(--space-6));
      bottom: var(--space-4);
      background: var(--color-surface-default);
      border: 1px solid var(--color-border-default);
      border-radius: var(--radius-s);
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 25;
    }

    .panel__header {
      padding: var(--space-4) var(--space-4) var(--space-3);
      border-bottom: 1px solid var(--color-border-default);
      flex-shrink: 0;
    }

    .panel__back-row {
      display: flex;
      align-items: flex-start;
      gap: var(--space-2);
    }

    .panel__back {
      width: var(--space-8);
      height: var(--space-8);
      flex-shrink: 0;
      border: 1px solid var(--color-border-default);
      border-radius: var(--radius-xs);
      background: var(--color-surface-raised);
      color: var(--color-icon-subtle);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: var(--space-1);
      transition: color 0.15s;
    }

    .panel__back:hover {
      color: var(--color-icon-default);
    }

    .panel__back svg {
      width: var(--space-4);
      height: var(--space-4);
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .panel__title {
      font-size: var(--font-size-body-md);
      font-weight: var(--font-weight-semibold);
      line-height: var(--line-height-body-md);
      letter-spacing: -0.02em;
    }

    .panel__subtitle {
      font-size: var(--font-size-label);
      line-height: var(--line-height-body-sm);
      color: var(--color-text-secondary);
      margin-top: var(--space-1);
    }

    .panel__body {
      flex: 1;
      overflow-y: auto;
      padding: var(--space-3) var(--space-4) var(--space-4);
    }

    .panel__body::-webkit-scrollbar {
      width: var(--space-2);
    }

    .panel__body::-webkit-scrollbar-thumb {
      background: var(--color-border-strong);
      border-radius: var(--radius-xs);
    }

    /* Region card */
    .region-card {
      background: var(--color-surface-raised);
      border: 1px solid var(--color-border-default);
      border-radius: var(--radius-s);
      padding: var(--space-3) var(--space-4);
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-3);
    }

    .region-card__name {
      font-size: var(--font-size-body-md);
      font-weight: var(--font-weight-semibold);
      line-height: var(--line-height-body-md);
      margin-bottom: var(--space-1);
    }

    .region-card__meta {
      font-size: var(--font-size-label);
      line-height: var(--line-height-body-sm);
      color: var(--color-text-secondary);
    }

    .region-card__badge {
      min-width: calc(var(--space-8) + var(--space-1));
      height: calc(var(--space-8) + var(--space-1));
      padding: 0 var(--space-2);
      border-radius: var(--radius-xs);
      background: var(--color-surface-brand-subtle);
      border: 1px solid color-mix(in srgb, var(--color-border-brand) 30%, transparent);
      color: var(--color-text-brand);
      font-size: var(--font-size-body-sm);
      font-weight: var(--font-weight-semibold);
      line-height: var(--line-height-body-sm);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Status filters */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
      margin-bottom: var(--space-3);
    }

    .filter-badge {
      padding: var(--space-1) var(--space-2);
      font-family: inherit;
      font-size: var(--font-size-badge);
      font-weight: var(--font-weight-semibold);
      line-height: var(--line-height-body-sm);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      border-radius: var(--radius-xs);
      border: 1px solid var(--color-border-default);
      background: transparent;
      color: var(--color-text-secondary);
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .filter-badge:hover {
      color: var(--color-text-primary);
      border-color: var(--color-border-strong);
      background: var(--color-surface-raised);
    }

    .filter-badge--active {
      background: var(--color-surface-brand-subtle);
      border-color: var(--color-border-brand);
      color: var(--color-text-brand);
    }

    .filter-badge--completed { color: var(--color-status-success); }
    .filter-badge--in-progress { color: var(--color-status-warning); }
    .filter-badge--re-survey { color: var(--color-status-warning); }
    .filter-badge--submitted { color: var(--color-status-info); }
    .filter-badge--rejected { color: var(--color-status-error); }

    /* Panel search */
    .panel-search {
      position: relative;
      margin-bottom: var(--space-3);
    }

    .panel-search svg {
      position: absolute;
      left: var(--space-3);
      top: 50%;
      transform: translateY(-50%);
      width: var(--space-3);
      height: var(--space-3);
      stroke: var(--color-icon-subtle);
      fill: none;
      stroke-width: 2;
      pointer-events: none;
    }

    .panel-search input {
      width: 100%;
      height: calc(var(--space-8) + var(--space-2));
      padding: 0 var(--space-3) 0 calc(var(--space-8) + var(--space-1));
      font-family: inherit;
      font-size: var(--font-size-body-sm);
      line-height: var(--line-height-body-sm);
      color: var(--color-text-primary);
      background: var(--color-surface-raised);
      border: 1px solid var(--color-border-default);
      border-radius: var(--radius-xs);
      outline: none;
    }

    .panel-search input::placeholder {
      color: var(--color-text-tertiary);
    }

    .panel-search input:focus {
      border-color: var(--color-border-brand);
    }

    /* Section cards */
    .section-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }

    .section-card {
      background: var(--color-surface-raised);
      border: 1px solid var(--color-border-default);
      border-radius: var(--radius-s);
      padding: var(--space-3) var(--space-4);
      transition: border-color 0.15s;
    }

    .section-card:hover {
      border-color: color-mix(in srgb, var(--color-border-brand) 35%, transparent);
    }

    .section-card__top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--space-2);
      margin-bottom: var(--space-3);
    }

    .section-card__id {
      font-size: var(--font-size-body-sm);
      font-weight: var(--font-weight-semibold);
      line-height: var(--line-height-body-sm);
      letter-spacing: -0.01em;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      padding: var(--space-1) var(--space-2);
      font-size: var(--font-size-badge);
      font-weight: var(--font-weight-semibold);
      line-height: var(--line-height-body-sm);
      letter-spacing: 0.03em;
      text-transform: uppercase;
      border-radius: var(--radius-xs);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .status-badge--completed {
      background: var(--color-status-success-subtle);
      color: var(--color-status-success);
      border: 1px solid color-mix(in srgb, var(--color-status-success) 30%, transparent);
    }

    .status-badge--in-progress {
      background: var(--color-status-warning-subtle);
      color: var(--color-status-warning);
      border: 1px solid color-mix(in srgb, var(--color-status-warning) 35%, transparent);
    }

    .status-badge--re-survey {
      background: var(--color-status-warning-subtle);
      color: var(--color-status-warning);
      border: 1px solid color-mix(in srgb, var(--color-status-warning) 35%, transparent);
    }

    .status-badge--rejected {
      background: var(--color-status-error-subtle);
      color: var(--color-status-error);
      border: 1px solid color-mix(in srgb, var(--color-status-error) 35%, transparent);
    }

    .status-badge--submitted {
      background: var(--color-status-info-subtle);
      color: var(--color-status-info);
      border: 1px solid color-mix(in srgb, var(--color-status-info) 35%, transparent);
    }

    .section-card__row {
      display: flex;
      justify-content: space-between;
      font-size: var(--font-size-label);
      line-height: var(--line-height-body-sm);
      margin-bottom: var(--space-2);
    }

    .section-card__label {
      color: var(--color-text-secondary);
    }

    .section-card__value {
      font-weight: var(--font-weight-medium);
      text-align: right;
    }

    .section-card__footer {
      margin-top: var(--space-3);
      padding-top: var(--space-3);
      border-top: 1px solid var(--color-border-default);
    }

    .btn-details {
      width: 100%;
      height: calc(var(--space-8) + var(--space-2));
      font-family: inherit;
      font-size: var(--font-size-label);
      font-weight: var(--font-weight-medium);
      line-height: var(--line-height-body-sm);
      color: var(--color-text-brand);
      background: transparent;
      border: 1px solid var(--color-border-brand);
      border-radius: var(--radius-xs);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .btn-details:hover {
      background: var(--color-surface-brand);
      color: var(--color-text-inverse);
    }

    @media (max-width: calc(var(--space-12) * 16)) {
      .topnav__breadcrumb,
      .topnav__search-wrap {
        display: none;
      }

      .panel {
        width: calc(100% - var(--space-8));
        max-width: calc(var(--space-12) * 7 + var(--space-6));
      }

      .scale-bar {
        left: var(--space-4);
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="map" aria-hidden="true">
      <div class="map__grid"></div>
      <span class="map__label">Map View</span>
    </div>

    <header class="topnav">
      <div class="topnav__left">
        <div class="topnav__logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/>
          </svg>
        </div>
        <span class="topnav__brand">Geological Hazard</span>
        <nav class="topnav__breadcrumb" aria-label="Breadcrumb">
